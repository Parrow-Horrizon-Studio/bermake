name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Every job only reads the repo, except release-draft, which runs on tags only
# and is granted contents: write to create a draft release. The github-script
# steps call core.exportVariable only, never the API.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install Qt system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-shape0 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Set CMAKE_TOOLCHAIN_FILE (Linux/macOS)
        if: runner.os != 'Windows'
        run: echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV

      - name: Set CMAKE_TOOLCHAIN_FILE (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Bermake (editable, with dev deps)
        env:
          # Use vcpkg's GitHub Actions binary cache so Assimp (M6c) builds once
          # and is restored on later runs. The ACTIONS_* tokens are exported by
          # the "Export GitHub Actions cache env for vcpkg" step above.
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest -v

      - name: Install nanobind for standalone CMake
        run: pip install nanobind

      - name: Configure C++ tests (Linux)
        if: runner.os == 'Linux'
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          NANOBIND_DIR=$(python -c "import nanobind; print(nanobind.cmake_dir())")
          cmake -B build/tests -S . -G Ninja -Dnanobind_DIR="$NANOBIND_DIR"

      - name: Configure C++ tests (Windows)
        if: runner.os == 'Windows'
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          $nanobindDir = python -c "import nanobind; print(nanobind.cmake_dir())"
          cmake -B build/tests -S . -G "Visual Studio 17 2022" -A x64 "-Dnanobind_DIR=$nanobindDir"

      - name: Build C++ tests
        run: cmake --build build/tests --config Release

      - name: Run C++ tests
        working-directory: build/tests
        run: ctest --output-on-failure -C Release

  package-windows:
    name: Package (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Set CMAKE_TOOLCHAIN_FILE
        run: echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # The archive is pinned by SHA-256 in tools/fetch_mesa.py, which verifies
      # a restored copy exactly as it verifies a fresh download.
      - name: Cache the pinned Mesa archive
        uses: actions/cache@v6
        with:
          path: build/mesa-cache
          key: mesa-26.2.3-3f3613adb43cfd0f

      - name: Build the Windows package
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: python tools/package_windows.py

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: bermake-windows
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error

  release-draft:
    name: Draft release
    needs: package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: The tag must match pyproject.toml
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{declared}":
              sys.exit(f"tag {tag} does not match pyproject.toml version {declared}")
          print(f"tag {tag} matches pyproject.toml")
          EOF

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: bermake-windows
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --draft --verify-tag
          --title "Bermake $GITHUB_REF_NAME"
          --notes "Draft created by CI. Release notes to follow."

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned linters
        run: python -m pip install ruff==0.15.13 clang-format==18.1.8
      - name: ruff check
        run: ruff check python/bermake tools packaging
      - name: ruff format --check
        run: ruff format --check python/bermake tools packaging
      - name: clang-format --dry-run (pinned 18.1.8, matches local)
        run: |
          find cpp \( -name "*.cpp" -o -name "*.h" \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
